name: Release

# A v* tag runs the test suites, builds the three bundles, smoke-tests each on
# its own OS and publishes a GitHub Release with them -- only once every test
# and every smoke test has passed. There is no other CI: nothing runs on an
# ordinary push. The smoke test is the real first-run
# path: `mytube --self-test` downloads yt-dlp, ffmpeg and deno fresh from their
# publishers into an empty directory, verifies each checksum, runs each one and
# checks yt-dlp sees deno as a JS runtime — the only place the per-OS source
# table is proven on a real machine. A manual run, or a push to the
# `release-check` branch, tests and builds without releasing -- the branch is
# for checking a release build from a machine with no `gh` to dispatch with.

on:
  push:
    tags: ["v*"]
    branches: [release-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag matches tauri.conf.json, Cargo.toml and package.json
        shell: bash
        run: |
          tauri=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')
          npm=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          echo "tauri.conf.json: $tauri"
          echo "Cargo.toml:      $cargo"
          echo "package.json:    $npm"
          if [[ "$cargo|$npm" != "$tauri|$tauri" ]]; then
            echo "::error::versions disagree: tauri.conf.json $tauri, Cargo.toml $cargo, package.json $npm"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$tauri" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version ($tauri)"
            exit 1
          fi
          echo "version=$tauri" >> "$GITHUB_OUTPUT"

  # The frontend and backend suites on the three OSes MyTube ships for. They
  # run beside the builds rather than before them, so testing adds no time to
  # a release; publishing waits for both.
  test:
    name: Test (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests only, so the glibc floor does not matter here: unlike the
          # Linux build, this runs on the runner itself, not in ubuntu:22.04.
          - runner: ubuntu-24.04
            os_name: linux
          - runner: windows-latest
            os_name: windows
          - runner: macos-latest      # Apple Silicon
            os_name: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # LF on Windows too, which the fixtures `include_str!` embeds byte for
      # byte need: .gitattributes sees to it.
      - uses: actions/checkout@v7

      # Tauri's Debian prerequisites, minus libayatana-appindicator3-dev: the
      # Linux tray speaks StatusNotifierItem itself (ksni) and links no
      # appindicator library.
      - name: Linux build dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev patchelf

      - uses: ./.github/actions/setup

      - name: Frontend tests
        run: bun run test

      # Also makes dist/, which `tauri::generate_context!` needs to exist
      # before the Rust half will compile.
      - name: Frontend type-check and build
        run: bun run build

      - name: Backend tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log

      # Job logs need a signed-in viewer; annotations do not. Each failing
      # test's name and output becomes one, so a red run can be read from the
      # API or the run's summary page by anyone.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" - <<'PY'
          import re
          text = open("cargo-test.log", encoding="utf-8", errors="replace").read().replace("\r\n", "\n")
          blocks = re.findall(r"^---- (\S+) stdout ----\n(.*?)(?=^---- |^failures:|\Z)", text, re.S | re.M)
          if not blocks:
              blocks = [("cargo test", text[-4000:])]
          for name, body in blocks[:20]:
              body = body.strip()[-3000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={name.replace('::', '.')}::{body}")
          PY

  # The Cloudflare Worker in sync-server/ is its own bun project. Its tests run
  # in workerd, which is the same on every OS, so Linux alone is enough.
  sync-server:
    name: Sync server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Tests
        run: bun run test

  build:
    name: Build (${{ matrix.os_name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GitHub-hosted ubuntu-22.04 image is being retired
          # (actions/runner-images#14254), but it is still the oldest base with
          # webkit2gtk-4.1, and building on it is what holds the glibc floor
          # at 2.35. So the job runs on a current runner inside a plain
          # ubuntu:22.04 container.
          - runner: ubuntu-24.04
            container: ubuntu:22.04
            os_name: linux
            bundles: deb,rpm,appimage
            smoke: bash .github/scripts/smoke-linux.sh
          - runner: windows-latest
            os_name: windows
            bundles: nsis
            smoke: pwsh -NoProfile -NonInteractive -File .github/scripts/smoke-windows.ps1
          - runner: macos-latest      # Apple Silicon
            os_name: macos
            bundles: app,dmg
            smoke: bash .github/scripts/smoke-macos.sh
    runs-on: ${{ matrix.runner }}
    # Bash everywhere a step names no shell. Inside the Linux container the
    # default is `sh` -- dash, which has no `[[` -- and the steps below use it.
    defaults:
      run:
        shell: bash
    # An empty image runs the job on the runner itself (Windows, macOS). The
    # `|| ''` form is what gets an empty value past the schema check.
    container:
      image: ${{ matrix.container || '' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
      # A container has no /dev/fuse, so no AppImage can mount itself: this
      # makes linuxdeploy and its plugins extract and run instead. The Tauri
      # bundler sets it for linuxdeploy too; this covers anything it spawns.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # Runs as root in the bare ubuntu:22.04 container, which has no sudo and
      # almost nothing else, so it comes before checkout: without git >= 2.18
      # on PATH, actions/checkout falls back to a REST download with no .git.
      # Tauri's Debian prerequisites (which include `file`; no appindicator:
      # the Linux tray is ksni), plus what the bare image lacks: git for
      # checkout, unzip for setup-bun, curl for the rustup bootstrap in
      # dtolnay/rust-toolchain, pkg-config for linuxdeploy's GTK plugin,
      # xdg-utils because the AppImage bundler copies /usr/bin/xdg-open into
      # the image and fails without it (the hosted runner image ships it),
      # xz-utils and ca-certificates for the self-test's tool downloads. No
      # libfuse2: nothing here mounts an AppImage (see APPIMAGE_EXTRACT_AND_RUN).
      - name: Linux build dependencies
        if: matrix.os_name == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git unzip xz-utils file xdg-utils \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - uses: actions/checkout@v7

      # Also trusts the workspace, which the Linux container needs.
      - uses: ./.github/actions/setup
        with:
          cache-key: release

      # beforeBuildCommand runs `bun run build` (tsc + vite) first.
      - name: Build
        timeout-minutes: 60
        run: bun run tauri build --ci --bundles ${{ matrix.bundles }}

      # One script per OS (.github/scripts/smoke-*), because the three share
      # no check and not even a shell: as steps they would each show as
      # skipped on the other two legs. Each check is a log group, and a failure
      # an annotation naming it. The longest check is the self-test's three
      # tool downloads.
      - name: Smoke test
        timeout-minutes: 30
        run: ${{ matrix.smoke }}

      # ------------------------------------------------------------ artifacts

      - name: Collect and rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          # Exactly one match per pattern: the version in the glob keeps a
          # stale bundle from an older build out, and two matches is an error.
          # No `mapfile`: macOS runners ship bash 3.2. The pattern is
          # expanded unquoted on purpose; bundle paths hold no spaces.
          take() {
            shopt -s nullglob
            local matches=( $1 )
            shopt -u nullglob
            if (( ${#matches[@]} != 1 )); then
              echo "::error::expected one file for $1, found ${#matches[@]}: ${matches[*]:-none}"
              exit 1
            fi
            cp "${matches[0]}" "out/$2"
            echo "$2  <-  ${matches[0]}"
          }
          case "${{ matrix.os_name }}" in
            linux)
              take "$bundle/deb/mytube_${VERSION}_*.deb"             "mytube-$TAG-linux-x86_64.deb"
              take "$bundle/rpm/mytube-${VERSION}-*.rpm"             "mytube-$TAG-linux-x86_64.rpm"
              take "$bundle/appimage/mytube_${VERSION}_*.AppImage"   "mytube-$TAG-linux-x86_64.AppImage"
              ;;
            windows)
              take "$bundle/nsis/mytube_${VERSION}_*-setup.exe"      "mytube-$TAG-windows-x64-setup.exe"
              ;;
            macos)
              take "$bundle/dmg/mytube_${VERSION}_*.dmg"             "mytube-$TAG-macos-arm64.dmg"
              ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: mytube-${{ matrix.os_name }}
          path: out/mytube-v*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: [version, test, sync-server, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the changelog is every commit since the
      # previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum mytube-v* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The release page is the changelog, then the Downloads table, nothing
      # else. First run, platform notes and uninstalling live in the wiki.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Changelog

          EOF
          # Since the previous v* tag, or all history for the first release.
          # "Release X.Y.Z" is the version bump the tag sits on, not a change.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          git log --no-merges --format='- %s (%h)' "${prev:+$prev..}$TAG" \
            | grep -Ev '^- Release [0-9]' >> notes.md || echo "- No changes." >> notes.md
          cat >> notes.md <<EOF

          ## Downloads

          | File | For |
          |---|---|
          | \`mytube-$TAG-windows-x64-setup.exe\` | Windows 10/11 (x64). Installs for you only, no admin rights needed |
          | \`mytube-$TAG-macos-arm64.dmg\` | macOS 11+ (Apple Silicon) |
          | \`mytube-$TAG-linux-x86_64.deb\` | Linux x86_64: Debian, Ubuntu 22.04+ and derivatives |
          | \`mytube-$TAG-linux-x86_64.rpm\` | Linux x86_64: Fedora, openSUSE |
          | \`mytube-$TAG-linux-x86_64.AppImage\` | Linux x86_64: any other distribution |
          | \`SHA256SUMS.txt\` | SHA-256 checksums of every file above |
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: MyTube ${{ github.ref_name }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/mytube-v*
            dist/SHA256SUMS.txt
